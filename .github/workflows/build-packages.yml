name: Pakete bauen

# PyInstaller kann nicht über Plattformen hinweg bauen: die Windows-.exe muss
# auf Windows entstehen, die .app/.dmg auf macOS, die .tar.gz auf Linux.
# Dieser Workflow erledigt alle drei auf GitHubs Runnern.
#
# Starten:  Actions → "Pakete bauen" → Run workflow
#           (oder automatisch beim Pushen eines Tags v1.2.3)
# Ergebnis: die drei Pakete als Artefakte unterhalb des Workflow-Laufs.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: App bauen
        run: pyinstaller pap_editor.spec --distpath build/windows/dist --workpath build/windows/work --noconfirm

      - name: Installer mit Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc packaging\pap_editor.iss

      - name: Ordner-Variante zippen (ohne Installer nutzbar)
        shell: pwsh
        run: Compress-Archive -Path build\windows\dist\PAP-Editor\* -DestinationPath dist\PAP-Editor-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PAP-Editor-Windows
          path: |
            dist/PAP-Editor-Setup.exe
            dist/PAP-Editor-windows-x86_64.zip

  macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: App bauen
        run: pyinstaller pap_editor.spec --distpath build/macos/dist --workpath build/macos/work --noconfirm

      - name: DMG erzeugen
        run: |
          mkdir -p dist
          hdiutil create -volname "PAP Editor" -srcfolder build/macos/dist/PAP-Editor.app -ov -format UDZO dist/PAP-Editor.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: PAP-Editor-macOS
          path: dist/PAP-Editor.dmg

  linux:
    name: Linux (.tar.gz)
    # bewusst die ältere LTS: das Ergebnis läuft dann auch auf älteren Distributionen
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tk-Bibliothek
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: App bauen
        run: pyinstaller pap_editor.spec --distpath build/linux/dist --workpath build/linux/work --noconfirm

      - name: tar.gz erzeugen
        run: |
          mkdir -p dist
          printf '#!/usr/bin/env bash\ncd "$(dirname "$0")"\nexec ./PAP-Editor "$@"\n' > build/linux/dist/PAP-Editor/starten.sh
          chmod +x build/linux/dist/PAP-Editor/starten.sh
          tar -czf dist/PAP-Editor-1.0.0-linux-x86_64.tar.gz -C build/linux/dist PAP-Editor

      - uses: actions/upload-artifact@v4
        with:
          name: PAP-Editor-Linux
          path: dist/PAP-Editor-1.0.0-linux-x86_64.tar.gz
